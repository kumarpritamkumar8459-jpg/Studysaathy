name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
                
      - name: Build APK
        run: gradle assembleDebug

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          find . -type f -name "*.apk" -exec cp {} apk-output/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          
